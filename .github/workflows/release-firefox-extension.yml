name: Release Firefox Sidecar Extension

on:
  pull_request:
    paths:
      - '.github/workflows/release-firefox-extension.yml'
      - 'webext/**'
      - 'scripts/prepare-firefox-extension.py'
      - 'scripts/generate-firefox-update-manifest.py'
      - 'tests/test_sidecar_release.py'
      - 'PRIVACY.md'
  workflow_dispatch:
    inputs:
      publish:
        description: Sign through AMO and publish a new GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  EXTENSION_ID: credentialsd-firefox-sidecar@plfjy.top

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g web-ext@8.10.0
      - run: python3 scripts/prepare-firefox-extension.py "$RUNNER_TEMP/firefox-extension"
      - run: python3 tests/test_sidecar_release.py "$RUNNER_TEMP/firefox-extension"
      - run: web-ext lint --self-hosted --source-dir="$RUNNER_TEMP/firefox-extension"
      - run: git diff --check

  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && inputs.publish == true && github.repository == 'PLFJY/credentialsd' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    environment: amo-signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g web-ext@8.10.0
      - id: version
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("webext/add-on/manifest.firefox.json"))["version"])')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=firefox-v$VERSION" >> "$GITHUB_OUTPUT"
          echo "xpi=credentialsd-sidecar-firefox-$VERSION.xpi" >> "$GITHUB_OUTPUT"
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1
          ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
      - run: python3 scripts/prepare-firefox-extension.py "$RUNNER_TEMP/firefox-extension"
      - env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: web-ext sign --channel=unlisted --source-dir="$RUNNER_TEMP/firefox-extension" --artifacts-dir="$RUNNER_TEMP/amo" --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET"
      - id: artifact
        env:
          VERSION: ${{ steps.version.outputs.version }}
          XPI: ${{ steps.version.outputs.xpi }}
        run: |
          test "$(find "$RUNNER_TEMP/amo" -name '*.xpi' -type f | wc -l)" = 1
          cp "$(find "$RUNNER_TEMP/amo" -name '*.xpi' -type f)" "$RUNNER_TEMP/$XPI"
          python3 - "$RUNNER_TEMP/$XPI" "$VERSION" "$EXTENSION_ID" <<'PY'
          import json
          import sys
          import zipfile
          with zipfile.ZipFile(sys.argv[1]) as xpi:
              if "manifest.json" not in xpi.namelist() or not any(n.startswith("META-INF/") for n in xpi.namelist()):
                  raise SystemExit("signed XPI is missing manifest or Mozilla signing metadata")
              manifest = json.loads(xpi.read("manifest.json"))
          if manifest.get("version") != sys.argv[2]:
              raise SystemExit("signed XPI version does not match release version")
          if manifest.get("browser_specific_settings", {}).get("gecko", {}).get("id") != sys.argv[3]:
              raise SystemExit("signed XPI extension ID does not match")
          PY
          echo "sha256=$(sha256sum "$RUNNER_TEMP/$XPI" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - env:
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: python3 scripts/generate-firefox-update-manifest.py --version "$VERSION" --sha256 "$SHA256" --output "$RUNNER_TEMP/updates.json"
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          XPI: ${{ steps.version.outputs.xpi }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Firefox Sidecar Extension ${{ steps.version.outputs.version }}" "$RUNNER_TEMP/$XPI" "$RUNNER_TEMP/updates.json"
      - env:
          TAG: ${{ steps.version.outputs.tag }}
          XPI: ${{ steps.version.outputs.xpi }}
          SHA256: ${{ steps.artifact.outputs.sha256 }}
        run: |
          curl --fail --location --retry 5 "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$XPI" --output "$RUNNER_TEMP/published.xpi"
          test "$(sha256sum "$RUNNER_TEMP/published.xpi" | awk '{print $1}')" = "$SHA256"
          curl --fail --location --retry 5 "https://github.com/PLFJY/credentialsd/releases/latest/download/updates.json" --output "$RUNNER_TEMP/published-updates.json"
          python3 - "$RUNNER_TEMP/published-updates.json" "$EXTENSION_ID" "$TAG" "$XPI" <<'PY'
          import json
          import sys
          update = json.load(open(sys.argv[1]))["addons"][sys.argv[2]]["updates"][0]
          if f"/releases/download/{sys.argv[3]}/{sys.argv[4]}" not in update["update_link"]:
              raise SystemExit("published update manifest does not reference this immutable XPI")
          PY
