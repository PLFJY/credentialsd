# Systemd drop-in for the Credential Portal sidecar frontend unit
# (credentials-portal-sidecar.service).
#
# The sidecar unit itself is generated by the xdg-desktop-portal sidecar build.
# This drop-in is the credentialsd package's contribution to that unit's
# environment. It overrides ONLY the sidecar process's desktop identity so the
# sidecar loads the dedicated credentials-sidecar-portals.conf, regardless of
# the user's real desktop environment (GNOME, KDE Plasma, Hyprland, sway, ...).
#
# This deliberately does NOT touch the standard distro xdg-desktop-portal.service:
# the drop-in directory is named after the sidecar unit only, so the standard
# frontend keeps observing the user's real XDG_CURRENT_DESKTOP and its normal
# desktop-provided configuration.
[Service]
Environment=XDG_CURRENT_DESKTOP=credentials-sidecar
Environment=XDG_DESKTOP_PORTAL_ENABLE_EXPERIMENTAL=credential
